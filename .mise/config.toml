[settings]
# Skip releases younger than 24 hours when mise chooses a version (`mise upgrade`, `latest`, ranges),
# enforcing the 24-hour version policy. An exact version pinned here still installs.
minimum_release_age = "1d"

[tools]
just = "1.58.0"
node = "26.5.0"
# Keep in step with the `vite-plus` catalog entry in pnpm-workspace.yaml. When
# the global CLI and the workspace install disagree, local and CI runs of
# `vp check` can lint the same code differently. Formatting does not go through
# Vite+: oxfmt-next-line below formats with next-line braces.
"npm:vite-plus" = "0.2.9"
"npm:oxfmt-next-line" = { version = "0.75.0", allow_low_downloads = true }
pre-commit = "4.6.0"
